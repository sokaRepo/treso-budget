<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trésorerie Crèche Parentale</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍼</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🍼</span>
      <div>
        <h1 id="app-title">Trésorerie Crèche Parentale</h1>
        <span class="subtitle" id="app-subtitle">Suivi de trésorerie, factures, subventions &amp; simulations</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="solde-chip" id="top-solde" title="Solde de trésorerie aujourd'hui">—</div>
      <button class="btn ghost" id="btn-export-top" title="Télécharger la base de données JSON">⬇ Exporter</button>
      <button class="btn ghost" id="btn-import-top" title="Charger une base JSON depuis un fichier">⬆ Importer</button>
      <input type="file" id="import-file-top" accept=".json,application/json" hidden>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="dashboard" class="tab active">📊 Tableau de bord</button>
    <button data-view="expenses" class="tab">💸 Dépenses</button>
    <button data-view="invoices" class="tab">🧾 Factures &amp; familles</button>
    <button data-view="subventions" class="tab">🏛️ Subventions</button>
    <button data-view="team" class="tab">👥 Équipe</button>
    <button data-view="reports" class="tab">📅 Mensuel / Annuel</button>
    <button data-view="simulator" class="tab">🔮 Simulateur</button>
    <button data-view="data" class="tab">💾 Données</button>
  </nav>

  <main id="view" class="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <footer class="footer">
    <span id="save-state">💾 Données enregistrées dans le navigateur (localStorage)</span>
    <span class="footer-hint">La base JSON peut être téléchargée (bouton Exporter) et rechargée à tout moment.</span>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/expenses.js"></script>
  <script src="js/views/invoices.js"></script>
  <script src="js/views/subventions.js"></script>
  <script src="js/views/team.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/simulator.js"></script>
  <script src="js/views/data.js"></script>
</body>
</html>
